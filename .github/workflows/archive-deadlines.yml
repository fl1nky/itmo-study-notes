name: Обновить архив дедлайнов

on:
  push:
    branches: [main]
    paths:
      - ДЕДЛАЙНЫ.md
      - tools/deadlines.py
      - .github/workflows/archive-deadlines.yml
  schedule:
    # 00:10 Europe/Moscow (MSK is UTC+3).
    - cron: '10 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deadlines-${{ github.ref }}
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Проверить правила переноса
        run: python -m unittest discover -s tests -q
      - name: Обновить текущие сроки и архив
        run: python tools/deadlines.py
      - name: Сохранить изменения
        run: |
          if git diff --quiet -- "ДЕДЛАЙНЫ.md" "архив/ДЕДЛАЙНЫ.md"; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "ДЕДЛАЙНЫ.md" "архив/ДЕДЛАЙНЫ.md"
          git commit -m "chore: обновить архив дедлайнов"
          git push
